name: ClaimLess CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run medical bill auditor unit tests
        run: node --test tests/medicalBillAuditor.test.mjs
      - name: Run CLI audit on seed statement
        run: node bin/claimless-audit.mjs data/seed/jordan-itemized-bill.txt
